# Netlify build settings. Netlify's Next.js runtime is picked up automatically.
[build]
  # Bring the database in line with prisma/schema.prisma, then build. `db push` only adds
  # what is missing and stops the build rather than delete data, so a bad schema change
  # can never go live against a database that doesn't match it.
  command = "npx prisma db push --skip-generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
